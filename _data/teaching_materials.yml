# Add one entry per PDF. The page sorts entries by week, from first to last.
# Put PDFs in assets/teaching/ and use the exact filename (including case).
- week: 1
  title: Calculus of Variations
  date: 2026-11-01
  pdf: /assets/teaching/CAP_I_A_EN.pdf
  pages: 18
  description: >-
    An introduction to variational methods, from the Euler–Lagrange equations
    and the principles of Fermat and least action to conservation of energy
    and momentum, multiple dependent variables, and holonomic constraints.
- week: 2
  title: Functionals
  date: 2026-11-09
  pdf: /assets/teaching/CAP_I_B_EN.pdf
  pages: 28
  description: >-
    An introduction to functionals and functional derivatives, including
    variational notation, differentiation rules, and the Dirac delta function,
    with applications to kinetic- and potential-energy functionals in density functional theory.
- week: 3
  title: Lagrange Multipliers
  date: 2026-11-09
  pdf: /assets/teaching/CAP_I_C_EN.pdf
  pages: 5
  description: >-
    Constrained optimization using Lagrange multipliers, with a geometric
    interpretation and worked examples. Extends the method to functionals
    subject to integral constraints and the modified Euler–Lagrange equation.
- week: 4
  title: Finite Difference Method
  date: 2026-11-09
  pdf: /assets/teaching/CAP_I_D_EN.pdf
  pages: 3
  description: >-
    Derivation of forward, backward, and central finite difference formulas
    from Taylor expansions, including higher-order derivatives, truncation
    errors, and exercises comparing numerical and exact derivatives.
- week: 5
  title: The Verlet Algorithm
  date: 2026-11-09
  pdf: /assets/teaching/CAP_I_E_EN.pdf
  pages: 7
  description: >-
    Numerical integration of atomic motion using the Verlet, velocity Verlet,
    and leapfrog algorithms. Covers time-step selection, error behavior,
    and numerical evaluation of forces for molecular dynamics simulations.
- week: 6
  title: Vector Spaces
  date: 2026-11-11
  pdf: /assets/teaching/CAP_I_F_EN.pdf
  pages: 20
  description: >-
    Introduces groups, fields, vector spaces, inner products, norms, and Hilbert
    spaces. Uses Dirac notation to explain linear operators, Hermitian adjoints,
    changes of basis, eigenvalues, and eigenvectors.
- week: 7
  title: Natural Transition Orbitals (NTOs)
  date: 2026-11-11
  pdf: /assets/teaching/CAP_VI_C_EN.pdf
  pages: 18
  description: >-
    Worked examples show how to assemble a transition matrix from excitation
    amplitudes and use singular value decomposition to obtain hole–electron
    orbital pairs for interpreting electronic excitations.
